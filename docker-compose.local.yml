services:
  scenario-service:
    build: .
    container_name: scenario-service
    restart: unless-stopped
    ports:
      - "8040:8040"
    environment:
      DB_HOST: host.docker.internal
      DB_USER: scenario_user
      DB_PASSWORD: scenario_local_change_me
      DB_NAME: scenario_db
      DB_PORT: 8621
      SCENARIO_GRAPH_NAME: "${SCENARIO_GRAPH_NAME:-scenario_graph}"
      LLM_GATEWAY_HOST: "35.216.98.244"
      LLM_GATEWAY_PORT: 8060
      APP_HOST: 0.0.0.0
      APP_PORT: 8040
      APP_ENV: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - platform-net

networks:
  platform-net:
    name: platform-net
    external: true
